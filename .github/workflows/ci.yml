name: Python Project CI

# Trigger the workflow on every push or pull request to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your repository files onto the GitHub runner
      - name: Check out repository code
        uses: actions/checkout@v4

      # 2. Set up the Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # You can change this to 3.9, 3.11, etc.

      # 3. Upgrade pip and install requirements if you have a requirements.txt file
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Run your main python file to make sure it has no syntax errors
      - name: Run Python Script
        run: |
          python main.py

