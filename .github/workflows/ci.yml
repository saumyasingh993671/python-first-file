name: Jupyter Notebook CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-notebook:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your repository files
      - name: Check out repository code
        uses: actions/checkout@v4

      # 2. Set up the Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install Jupyter and execution dependencies
      - name: Install Jupyter dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Execute your notebook file and check for errors
      - name: Run Jupyter Notebook
        run: |
          jupyter nbconvert --to notebook --execute Untitled.ipynb
