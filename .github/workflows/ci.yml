name: Project CI Pipeline

# 1. TRIGGER: Run this every time someone pushes code to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 2. RUNNER: The virtual computer that will run our tests
  test-project:
    runs-on: ubuntu-latest

    # 3. STEPS: The actual commands to run
    steps:
      # Step 1: Copy your uploaded repository code onto the virtual computer
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step 2: Install Node.js on the virtual computer
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: '20'

      # Step 3: Install your project's dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Run your code tests
      - name: Run automated tests
        run: npm test
